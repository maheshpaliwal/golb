# golb example configuration. Every listener address names its interface;
# an address without a host (":8080") is rejected.
# Check a file without starting: golb -check -config configs/golb.example.yaml

admin:
  addr: 127.0.0.1:9901        # metrics, health, backends, reload; "off" disables

access_log:
  enabled: false
  sample_rate: 1              # fraction of requests logged, 0..1

shutdown_grace: 30s

listeners:
  - name: web
    addr: 127.0.0.1:8080
    protocol: http
    timeouts:
      read_header: 5s
      idle: 60s
      request: 60s            # wait for an upstream response, all tries; 0 = none
      max_header_bytes: 65536
    routes:
      - path_prefix: /
        pool: app
    # Terminate TLS (HTTP/2 via ALPN) by adding:
    # tls:
    #   min_version: "1.2"
    #   certificates:
    #     - cert_file: /path/to/cert.pem
    #       key_file: /path/to/key.pem

  - name: raw
    addr: 127.0.0.1:9000
    protocol: tcp
    pool: app

pools:
  - name: app
    policy: p2c_ewma          # round_robin | least_conn | p2c_ewma | ring_hash
    backends:
      - addr: 127.0.0.1:9001
      - addr: 127.0.0.1:9002
        weight: 2
    health_check:
      type: http
      path: /healthz
    retry:
      max_attempts: 3         # total tries; 1 disables retries
      per_try_timeout: 10s
      budget_percent: 20
      retry_on: [502, 503, 504]
    transport:
      dial_timeout: 2s
      max_idle_conns_per_host: 256
      idle_conn_timeout: 90s
